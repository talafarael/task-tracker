services:
  mongo:
    image: mongo:7
    container_name: task-tracker-mongo
    restart: unless-stopped
    profiles: ["db", "full"]
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-tracker-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "mongodb://mongo:27017/task-tracker?replicaSet=rs0"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
